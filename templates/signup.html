<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account - TaskVise</title>
  <meta name="theme-color" content="#f7f6f3">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tv_auth.css') }}">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('landing') }}"><img src="{{ url_for('static', filename='apple-touch-icon.png') }}" alt="" width="28" height="28" style="border-radius:7px">TaskVise</a>
    <a class="back" href="{{ url_for('landing') }}">Back to home</a>
  </header>
  <main class="stage">
    <img class="flank flank-l" src="{{ url_for('static', filename='illustrations/tv-auth-signup.webp') }}" alt="" width="640" height="640" onerror="this.hidden=true">
    <section class="card">
      <h1>Create your account</h1>
      <p class="lede">Three short steps and you are in.</p>
      <ol class="stepper" aria-label="Progress"><li aria-current="step">You</li><li>Your role</li><li>Skills</li></ol>
      {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
      <form method="POST" action="{{ url_for('signup') }}" target="_top" id="signupForm">
        <fieldset class="step">
          <label class="field"><span>Full name</span>
            <input type="text" name="fullName" autocomplete="name" placeholder="Asha Verma" required autofocus></label>
          <label class="field"><span>Work email</span>
            <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@company.com" required></label>
          <label class="field"><span>Phone</span>
            <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="+91 98765 43210" required></label>
          <div class="actions"><button class="btn btn-primary" type="button" data-next>Continue</button></div>
          <div class="or">or</div>
          <a class="btn btn-ghost" href="{{ url_for('google_login') }}" target="_top">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.56c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.2 1.64l3.15-3.15A10.6 10.6 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
          Continue with Google
        </a>
        </fieldset>

        <fieldset class="step">
          <label class="field"><span>Role</span><select id="role" name="role" required>
                <option value="">Select role</option>
                <option value="admin">Admin</option>
                <option value="manager">Manager</option>
                <option value="hr">HR</option>
                <option value="teamlead">Team Lead</option>
                <option value="employee">Employee</option>
              </select></label>
          <label class="field"><span>Designation</span><select id="designation" name="designation" required>
                <option value="">Select designation</option>
                <option value="Software Engineer">Software Engineer</option>
                <option value="Senior Software Engineer">Senior Software Engineer</option>
                <option value="Lead Developer">Lead Developer</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="DevOps Engineer">DevOps Engineer</option>
                <option value="UI/UX Designer">UI/UX Designer</option>
                <option value="Product Manager">Product Manager</option>
                <option value="Project Manager">Project Manager</option>
                <option value="Team Lead">Team Lead</option>
                <option value="Technical Architect">Technical Architect</option>
                <option value="Quality Assurance">Quality Assurance</option>
                <option value="Business Analyst">Business Analyst</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Marketing Specialist">Marketing Specialist</option>
                <option value="Sales Representative">Sales Representative</option>
                <option value="HR Specialist">HR Specialist</option>
                <option value="Operations Manager">Operations Manager</option>
                <option value="Finance Manager">Finance Manager</option>
              </select></label>
          <label class="field"><span>Department</span><select id="department" name="department" required>
                <option value="">Select department</option>
                <option value="Engineering">Engineering</option>
                <option value="Product">Product</option>
                <option value="Design">Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Operations">Operations</option>
                <option value="Quality Assurance">Quality Assurance</option>
                <option value="DevOps">DevOps</option>
                <option value="Data Science">Data Science</option>
                <option value="Business Development">Business Development</option>
                <option value="Customer Support">Customer Support</option>
                <option value="Legal">Legal</option>
                <option value="IT">IT</option>
              </select></label>
          <div class="actions"><button class="btn btn-ghost" type="button" data-back>Back</button><button class="btn btn-primary" type="button" data-next>Continue</button></div>
        </fieldset>

        <fieldset class="step">
          <label class="field"><span>Skills</span>
            <span class="chips"><input type="text" placeholder="Type a skill, press Enter" aria-label="Add a skill" autocomplete="off"></span>
            <span class="hint">Press Enter or comma after each one. We use them to match you to tasks.</span></label>
          <input type="hidden" id="skills" name="skills" required>
          <div class="actions"><button class="btn btn-ghost" type="button" data-back>Back</button><button class="btn btn-primary" type="submit">Create account</button></div>
        </fieldset>
      </form>
      <p class="switch">Already have an account? <a href="{{ url_for('login') }}" target="_top">Sign in</a></p>
    </section>
    <img class="flank flank-r" src="{{ url_for('static', filename='illustrations/tv-carousel-team.webp') }}" alt="" width="640" height="640" onerror="this.hidden=true">
  </main>
  <script src="{{ url_for('static', filename='js/tv_auth.js') }}" defer></script>
</body>
</html>
