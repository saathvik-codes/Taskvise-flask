<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <script>document.documentElement.setAttribute("data-theme","light");</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}TaskVise - Professional Workforce Management{% endblock %}</title>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  {% block extra_head %}{% endblock %}
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tv_theme.css') }}">
  <script src="{{ url_for('static', filename='js/tv_polish.js') }}" defer></script>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <div class="preloader-inner">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="preloader-text">Loading TaskVise...</div>
    </div>
  </div>

  {% block content %}{% endblock %}
  
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    window.addEventListener('load', function() {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
